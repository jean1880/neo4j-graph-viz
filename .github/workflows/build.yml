name: build-image

# Build the viewer image and publish it so Unraid/Dockerman can pull a properly-tagged
# registry image (update-check, reinstall, version tracking all work). Matches the house
# style of nordlynx/plex-server: metadata-action + build-push-action + gha cache, pushing
# to GHCR and Docker Hub. amd64 only — the Unraid NAS is x86. The image bakes only app
# code; NEO4J_PASSWORD is injected at runtime, never built in.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Quality gate — fmt/clippy/test the Rust backend + build/typecheck the SPA before publishing.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust fmt / clippy / test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build + typecheck
        run: |
          cd frontend
          npm ci
          npm run build
          npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/neo4j-graph-viz
          tags: |
            type=edge,branch=master
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
