name: build-image

# Gate (fmt/clippy/test + SPA build/typecheck), then build and publish the image.
#
# Publishes to GHCR always, and additionally to Docker Hub only when the DOCKER_HUB_USERNAME
# secret is set — so forks and clones without those secrets still build green.
# The image bakes only app code; the endpoint and credentials are injected at runtime.
on:
  push:
    # Both names, so a fork or a re-homed repo using `main` still builds and publishes.
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least privilege by default; only the publishing job gets packages:write.
permissions:
  contents: read

jobs:
  # Quality gate — fmt/clippy/test the Rust backend + build/typecheck the SPA before publishing.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust fmt / clippy / test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Frontend build + typecheck
        run: |
          cd frontend
          npm ci
          npm run build
          npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Empty on a fork or a clone without the secret — every Docker Hub step keys off this.
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKER_HUB_USERNAME && format('{0}/neo4j-graph-viz', env.DOCKER_HUB_USERNAME) || '' }}
          tags: |
            type=edge
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
