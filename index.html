<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Graph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14151a; color: #d6d8e0;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #graph { position: fixed; inset: 0; }
  .panel { position: fixed; z-index: 10; background: rgba(24,25,32,.82);
    border: 1px solid #2c2e3a; border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #hud { top: 14px; left: 14px; width: 230px; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  #hud .sub { color: #8a8d9c; font-size: 11px; margin-bottom: 10px; }
  #search { width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid #34374a;
    background: #1c1d26; color: #e7e9f2; outline: none; }
  #search:focus { border-color: #5b8cff; }
  #legend { bottom: 14px; left: 14px; max-height: 46vh; overflow-y: auto; width: 210px; }
  #legend h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: #8a8d9c; font-weight: 600; }
  .lg { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px;
    cursor: pointer; user-select: none; }
  .lg:hover { background: rgba(255,255,255,.05); }
  .lg.off { opacity: .35; }
  .lg .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .lg .nm { flex: 1; }
  .lg .ct { color: #74778a; font-variant-numeric: tabular-nums; }
  #tip { position: fixed; z-index: 20; pointer-events: none; padding: 5px 9px;
    background: #0d0e13; border: 1px solid #34374a; border-radius: 6px; font-size: 12px;
    display: none; max-width: 260px; }
  #tip b { color: #fff; } #tip span { color: #8a8d9c; }
  .hint { position: fixed; bottom: 12px; right: 14px; color: #55586a; font-size: 11px; z-index: 10; }
</style>
</head>
<body>
<div id="graph"></div>
<div class="panel" id="hud">
  <h1>Homelab Graph</h1>
  <div class="sub" id="stats">loading…</div>
  <input id="search" type="search" placeholder="Search nodes…" autocomplete="off">
</div>
<div class="panel" id="legend"><h2>Types</h2><div id="legend-items"></div></div>
<div id="tip"></div>
<div class="hint">scroll = zoom · drag = pan · click = focus</div>

<script src="./force-graph.min.js"></script>
<script>
const el = document.getElementById('graph');
const tip = document.getElementById('tip');

// Stable, distinct-ish colour per label via hashed hue (tuned for dark bg).
const colorCache = {};
function colorFor(label) {
  if (colorCache[label]) return colorCache[label];
  let h = 0;
  for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) % 360;
  const c = `hsl(${h}, 62%, 62%)`;
  colorCache[label] = c;
  return c;
}

fetch('./graph.json').then(r => r.json()).then(data => {
  const hidden = new Set();          // hidden labels
  const hoverNodes = new Set();
  const hoverLinks = new Set();
  const adj = new Map();             // id -> neighbour ids
  data.links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    (adj.get(s) || adj.set(s, new Set()).get(s)).add(t);
    (adj.get(t) || adj.set(t, new Set()).get(t)).add(s);
  });

  document.getElementById('stats').textContent =
    `${data.nodes.length} nodes · ${data.links.length} links`;

  // Legend: label -> count, sorted desc.
  const counts = {};
  data.nodes.forEach(n => counts[n.label] = (counts[n.label] || 0) + 1);
  const box = document.getElementById('legend-items');
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([label, ct]) => {
    const row = document.createElement('div');
    row.className = 'lg';
    row.innerHTML = `<span class="dot" style="background:${colorFor(label)}"></span>`
      + `<span class="nm">${label}</span><span class="ct">${ct}</span>`;
    row.onclick = () => {
      if (hidden.has(label)) { hidden.delete(label); row.classList.remove('off'); }
      else { hidden.add(label); row.classList.add('off'); }
      Graph.nodeVisibility(n => !hidden.has(n.label));
    };
    box.appendChild(row);
  });

  const visible = n => !hidden.has(n.label);
  let query = '';

  const linkS = l => (typeof l.source === 'object' ? l.source.id : l.source);
  const linkT = l => (typeof l.target === 'object' ? l.target.id : l.target);

  const Graph = ForceGraph()(el)
    .graphData(data)
    .backgroundColor('#14151a')
    .nodeId('id')
    .nodeVal(n => 1 + Math.sqrt(n.deg))
    .nodeVisibility(visible)
    .linkVisibility(l => visible(l.source) && visible(l.target))
    .linkColor(l => hoverLinks.has(l) ? 'rgba(120,160,255,.9)' : 'rgba(150,155,180,.12)')
    .linkWidth(l => hoverLinks.has(l) ? 1.6 : 0.5)
    .linkDirectionalParticles(l => hoverLinks.has(l) ? 2 : 0)
    .linkDirectionalParticleWidth(2)
    .nodeCanvasObject((n, ctx, scale) => {
      const r = 2 + Math.sqrt(n.deg);
      const dim = hoverNodes.size && !hoverNodes.has(n.id);
      const match = query && n.name.toLowerCase().includes(query);
      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = colorFor(n.label);
      ctx.fill();
      if (match) { ctx.lineWidth = 2 / scale; ctx.strokeStyle = '#ffd24a'; ctx.stroke(); }
      if (scale > 1.6 || hoverNodes.has(n.id) || match) {
        const fs = Math.max(10 / scale, 3);
        ctx.font = `${fs}px ui-sans-serif, system-ui, sans-serif`;
        ctx.fillStyle = dim ? 'rgba(214,216,224,.3)' : '#d6d8e0';
        ctx.textAlign = 'center';
        ctx.fillText(n.name, n.x, n.y + r + fs * 1.1);
      }
      ctx.globalAlpha = 1;
    })
    .onNodeHover(n => {
      hoverNodes.clear(); hoverLinks.clear();
      if (n) {
        hoverNodes.add(n.id);
        (adj.get(n.id) || new Set()).forEach(id => hoverNodes.add(id));
        data.links.forEach(l => {
          if (linkS(l) === n.id || linkT(l) === n.id) hoverLinks.add(l);
        });
        tip.style.display = 'block';
        tip.innerHTML = `<b>${n.name}</b><br><span>${n.label} · deg ${n.deg}</span>`;
      } else {
        tip.style.display = 'none';
      }
      el.style.cursor = n ? 'pointer' : '';
    })
    .onNodeClick(n => { Graph.centerAt(n.x, n.y, 600); Graph.zoom(4, 600); })
    .onNodeRightClick(() => Graph.zoomToFit(500, 40));

  Graph.d3Force('charge').strength(-95);
  Graph.d3Force('link').distance(38);

  document.addEventListener('mousemove', e => {
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  });

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    if (query) {
      const hit = data.nodes.find(n => visible(n) && n.name.toLowerCase().includes(query));
      if (hit && hit.x != null) { Graph.centerAt(hit.x, hit.y, 500); Graph.zoom(3, 500); }
    }
  });

  window.addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
  Graph.width(innerWidth).height(innerHeight);
  setTimeout(() => Graph.zoomToFit(600, 60), 700);
});
</script>
</body>
</html>
